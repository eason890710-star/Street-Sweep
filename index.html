<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sweeping">
<meta name="theme-color" content="#2c3e5c">
<title>Street Sweeping</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    color-scheme: dark;
    --text: #ffffff;
    --muted: rgba(255, 255, 255, .68);
    --faint: rgba(255, 255, 255, .45);
    --glass: rgba(255, 255, 255, .14);
    --glass-on: rgba(255, 255, 255, .86);
    --stroke: rgba(255, 255, 255, .28);
    --on-text: #1c1c1e;
    --on-muted: rgba(28, 28, 30, .6);
    --accent: #ff9f0a;
    --danger: #ff6961;
    --blur: blur(28px) saturate(180%);
    --radius-l: 28px;
    --radius-m: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    font-size: 16px;
    line-height: 1.4;
    background: #2c3e5c;
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 40px);
  }

  /* Wallpaper */
  .wallpaper {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(60% 45% at 15% 10%, rgba(255, 183, 120, .55), transparent 70%),
      radial-gradient(55% 45% at 90% 30%, rgba(120, 170, 255, .55), transparent 70%),
      radial-gradient(70% 55% at 30% 95%, rgba(190, 120, 200, .45), transparent 70%),
      linear-gradient(165deg, #34507a 0%, #4a5f8a 40%, #6b5878 75%, #8a5f62 100%);
  }
  @media (prefers-color-scheme: dark) {
    .wallpaper {
      background:
        radial-gradient(60% 45% at 15% 10%, rgba(255, 150, 80, .28), transparent 70%),
        radial-gradient(55% 45% at 90% 30%, rgba(70, 120, 230, .35), transparent 70%),
        radial-gradient(70% 55% at 30% 95%, rgba(150, 80, 170, .3), transparent 70%),
        linear-gradient(165deg, #0d1626 0%, #18233c 45%, #261d33 80%, #2a1a22 100%);
    }
  }

  main { max-width: 560px; margin: 0 auto; }

  /* Glass material */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 1px solid var(--stroke);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .35),
      inset 0 -1px 0 rgba(255, 255, 255, .06),
      0 10px 30px rgba(0, 0, 0, .18);
  }

  /* Header */
  header { display: flex; align-items: flex-end; justify-content: space-between; margin: 6px 4px 14px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; text-transform: uppercase; }
  h1 { font-size: 34px; font-weight: 700; margin: 2px 0 0; letter-spacing: -.01em; }
  .round {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    color: var(--text); cursor: pointer; padding: 0;
  }

  .ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ic.sm { width: 16px; height: 16px; }
  .ic.lg { width: 22px; height: 22px; }

  h2 { font-size: 20px; font-weight: 700; margin: 26px 4px 10px; display: flex; align-items: center; justify-content: space-between; }
  h2 .sub { font-size: 14px; font-weight: 500; color: var(--muted); }

  /* Car hero (unframed, sits on wallpaper) */
  .hero { position: relative; margin: 0 0 18px; padding: 4px 0 0; }
  .hero .car { display: block; width: 92%; max-width: 360px; margin: 0 -8px 0 auto; position: relative; z-index: 1;
    filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .35)); }
  .hero .shadow { position: absolute; right: 4%; width: min(76%, 300px); bottom: 52px; height: 26px; z-index: 0;
    background: radial-gradient(closest-side, rgba(0, 0, 0, .45), transparent); }
  .hero .meta-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 6px 4px 0; }
  .hero .stat { font-size: 30px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
  .hero .stat small { font-size: 15px; font-weight: 600; margin-left: 3px; }
  .hero .label { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .hero .right { text-align: right; }
  .hero .color { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; background: #f4f5f7; border: 1px solid rgba(0, 0, 0, .25); }

  /* Map */
  .map-card { position: relative; border-radius: var(--radius-l); overflow: hidden; isolation: isolate; height: min(48vh, 400px); min-height: 280px; }
  #map { position: absolute; inset: 0; background: #39465c; }
  .map-ctrl { position: absolute; top: 12px; right: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
  .map-ctrl .round { width: 40px; height: 40px; background: rgba(40, 40, 50, .35); }
  .map-info {
    position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 1000;
    border-radius: var(--radius-m); padding: 14px 16px;
    background: rgba(30, 34, 46, .38);
  }
  .map-info .name { font-size: 17px; font-weight: 600; }
  .map-info .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .map-info .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .count { font-size: 26px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .count small { font-size: 13px; font-weight: 500; color: var(--muted); display: block; text-align: right; }

  .leaflet-control-attribution {
    background: rgba(20, 20, 30, .35) !important; color: rgba(255, 255, 255, .7) !important;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-radius: 8px 0 0 0; font-size: 9px !important;
  }
  .leaflet-control-attribution a { color: rgba(255, 255, 255, .85) !important; }
  .map-card.has-info .leaflet-bottom { bottom: 104px; }

  .car-pin {
    width: 44px; height: 44px; border-radius: 50%;
    background: #fff; color: var(--accent);
    display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35), 0 0 0 6px rgba(255, 159, 10, .28);
  }
  .car-pin .ic { width: 24px; height: 24px; stroke-width: 2; }
  .me-dot {
    width: 16px; height: 16px; border-radius: 50%;
    background: #0a84ff; border: 3px solid #fff;
    box-shadow: 0 0 0 8px rgba(10, 132, 255, .22), 0 2px 6px rgba(0, 0, 0, .3);
  }
  .seg-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(255, 255, 255, .9); border: 2px solid rgba(60, 60, 80, .55);
  }

  /* Tiles */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile {
    border-radius: var(--radius-m); padding: 14px;
    min-height: 104px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    text-align: left; color: var(--text); font: inherit; cursor: default;
    transition: background .2s, transform .15s;
  }
  button.tile { cursor: pointer; }
  button.tile:active { transform: scale(.97); }
  .tile .ibox {
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, .18);
  }
  .tile .t1 { font-size: 15px; font-weight: 600; line-height: 1.25; }
  .tile .t2 { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .tile.on { background: var(--glass-on); color: var(--on-text); border-color: rgba(255, 255, 255, .9); }
  .tile.on .t2 { color: var(--on-muted); }
  .tile.on .ibox { background: var(--accent); color: #fff; }
  .tile.wide { grid-column: span 2; min-height: 0; flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px; }

  /* Buttons */
  .actions { display: flex; gap: 10px; margin-top: 10px; }
  .pill {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: inherit; font-size: 15px; font-weight: 600; color: var(--text);
    padding: 13px 14px; border-radius: 999px; cursor: pointer; text-decoration: none;
  }
  .pill:active { transform: scale(.97); }
  .pill.primary { background: var(--glass-on); color: var(--on-text); border-color: rgba(255, 255, 255, .9); }
  .pill.danger { color: var(--danger); }
  .pill.full { width: 100%; margin-top: 12px; padding: 15px; font-size: 16px; }

  /* Panels & forms */
  .panel { border-radius: var(--radius-m); padding: 6px 16px; }
  .panel.pad { padding: 16px; }
  .line { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid rgba(255, 255, 255, .12); }
  .line:first-child { border-top: none; }
  .line .grow { flex: 1; min-width: 0; }
  .line .t1 { font-size: 15px; font-weight: 500; }
  .line .t2 { font-size: 13px; color: var(--muted); }
  .ibox-sq { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, .16); flex: none; }
  .iconbtn { background: none; border: none; color: var(--muted); padding: 6px; cursor: pointer; display: grid; place-items: center; }
  .iconbtn.del { color: var(--danger); }
  .empty { color: var(--muted); font-size: 14px; padding: 14px 0; }

  label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 2px 6px; }
  input[type=text], input[type=number], input[type=time], select {
    width: 100%; font: inherit; font-size: 16px; color: var(--text);
    padding: 11px 13px; border-radius: 14px;
    border: 1px solid var(--stroke); background: rgba(255, 255, 255, .1);
    -webkit-appearance: none; appearance: none;
  }
  input::placeholder { color: var(--faint); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .three { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
  .check { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 14px; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }

  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin: 0 4px 10px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .status .dot.ok { background: #30d158; }
  .status .dot.bad { background: var(--danger); }
  .status button { margin-left: auto; }

  .preview { border-radius: var(--radius-m); padding: 14px 16px; margin-top: 10px; font-size: 14px; color: var(--muted); }
  .preview b { color: var(--text); font-weight: 600; }
  .warn { margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255, 159, 10, .2); border: 1px solid rgba(255, 159, 10, .45); color: #ffd28a; font-size: 13px; }

  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .summary { display: flex; align-items: center; gap: 12px; padding: 14px 0; font-size: 15px; font-weight: 600; }
  .summary .chev { margin-left: auto; transition: transform .2s; color: var(--muted); }
  details[open] .summary .chev { transform: rotate(90deg); }
  details .body { padding-bottom: 16px; }

  .hidden { display: none !important; }

  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 18px); z-index: 2000;
    max-width: 420px; margin: 0 auto; text-align: center;
    padding: 13px 18px; border-radius: 999px; font-size: 15px; font-weight: 500;
    background: rgba(30, 34, 46, .5);
    opacity: 0; transform: translateY(12px); transition: all .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }

  @media (max-width: 360px) {
    .three { grid-template-columns: 1fr 1fr; }
    .three > :first-child { grid-column: span 2; }
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const KEY = 'sweep-app-v1';
const SHORTCUT_NAME = 'Street Sweeping Alert';
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYS_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DEFAULT_CENTER = [34.0224, -118.2851];

function defaults() {
  return { segments: [], current: null, history: [], settings: { lead: 45, shortcut: SHORTCUT_NAME } };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s) {
      const d = defaults();
      const st = { ...d, ...s, settings: { ...d.settings, ...(s.settings || {}) } };
      if (st.settings.shortcut === '掃街提醒') st.settings.shortcut = SHORTCUT_NAME; // migrate old default
      return st;
    }
  } catch (e) {}
  return defaults();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

let state = load();
save();
let here = null;
let selected = null; // spot id or 'manual'

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (name, cls = '') => `<svg class="ic ${cls}"><use href="#i-${name}"/></svg>`;

function time12(h, m) {
  const ap = h >= 12 ? 'PM' : 'AM';
  const hh = h % 12 || 12;
  return `${hh}:${pad(m)} ${ap}`;
}
function hhmm(str) {
  const [h, m] = str.split(':').map(Number);
  return time12(h, m);
}
function fmt(d) {
  return `${DAYS[d.getDay()]}, ${d.getMonth() + 1}/${d.getDate()} ${time12(d.getHours(), d.getMinutes())}`;
}
function fmtShort(d) {
  return `${DAYS[d.getDay()]} ${time12(d.getHours(), d.getMinutes())}`;
}
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

function dist(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtDist(m) {
  const ft = m * 3.28084;
  return ft < 1000 ? Math.round(ft) + ' ft away' : (m / 1609.34).toFixed(1) + ' mi away';
}

// Next sweeping time (today included, if it hasn't started yet)
function nextSweep(weekday, start) {
  const now = new Date();
  const [h, m] = start.split(':').map(Number);
  for (let i = 0; i < 8; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, h, m, 0);
    if (d.getDay() === Number(weekday) && d > now) return d;
  }
  return null;
}

function countdown(ms) {
  if (ms <= 0) return null;
  const mins = Math.floor(ms / 60000);
  const d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${m} min`;
}

// ---------- Car hero ----------
function renderHero() {
  const c = state.current;
  if (!c) {
    $('heroStat').textContent = 'Not parked';
    $('heroLabel').textContent = 'Status';
    return;
  }
  const cd = countdown(new Date(c.sweep) - new Date());
  $('heroStat').innerHTML = cd ? esc(cd) : 'Now';
  $('heroLabel').textContent = 'Until street sweeping';
}

// ---------- Map ----------
let map = null, carMarker = null, meMarker = null, segLayer = null, tileLayer = null;
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

function tileUrl() {
  return darkQuery.matches
    ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
    : 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
}

function initMap() {
  if (!window.L) {
    $('map').innerHTML = '<div style="display:grid;place-items:center;height:100%;color:rgba(255,255,255,.7);font-size:14px">Map unavailable. Check your connection.</div>';
    return;
  }
  map = L.map('map', { zoomControl: false, attributionControl: true }).setView(DEFAULT_CENTER, 15);
  tileLayer = L.tileLayer(tileUrl(), {
    maxZoom: 19, subdomains: 'abcd',
    attribution: '&copy; OpenStreetMap &copy; CARTO'
  }).addTo(map);
  segLayer = L.layerGroup().addTo(map);
  darkQuery.addEventListener && darkQuery.addEventListener('change', () => tileLayer.setUrl(tileUrl()));
}

function updateMap(recenter) {
  if (!map) return;
  const c = state.current;

  segLayer.clearLayers();
  state.segments.filter(s => s.lat != null).forEach(s => {
    L.marker([s.lat, s.lng], {
      icon: L.divIcon({ className: '', html: '<div class="seg-dot"></div>', iconSize: [12, 12], iconAnchor: [6, 6] })
    }).bindTooltip(s.name, { direction: 'top', offset: [0, -6] }).addTo(segLayer);
  });

  if (c && c.lat != null) {
    const pos = [c.lat, c.lng];
    if (!carMarker) {
      carMarker = L.marker(pos, {
        icon: L.divIcon({ className: '', html: `<div class="car-pin">${icon('car')}</div>`, iconSize: [44, 44], iconAnchor: [22, 22] }),
        zIndexOffset: 1000
      }).addTo(map);
    } else carMarker.setLatLng(pos);
  } else if (carMarker) {
    map.removeLayer(carMarker);
    carMarker = null;
  }

  if (here) {
    const pos = [here.lat, here.lng];
    if (!meMarker) {
      meMarker = L.marker(pos, {
        icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] })
      }).addTo(map);
    } else meMarker.setLatLng(pos);
  }

  if (recenter) {
    if (carMarker) map.setView(carMarker.getLatLng(), 17);
    else if (here) map.setView([here.lat, here.lng], 16);
  }
}

// ---------- Location ----------
function setLoc(text, ok) {
  $('locStatus').textContent = text;
  $('locDot').className = 'dot' + (ok === true ? ' ok' : ok === false ? ' bad' : '');
}

function locate(cb) {
  if (!navigator.geolocation) {
    setLoc('Location is not supported in this browser', false);
    cb && cb(null);
    return;
  }
  setLoc('Finding your location…');
  navigator.geolocation.getCurrentPosition(p => {
    const first = !here;
    here = { lat: p.coords.latitude, lng: p.coords.longitude };
    setLoc(`Located, accurate to about ${Math.round(p.coords.accuracy * 3.28084)} ft`, true);
    selected = null; // re-suggest the nearest spot
    renderPick();
    updateMap(first && !state.current);
    cb && cb(here);
  }, err => {
    setLoc('Could not get location: ' + err.message, false);
    cb && cb(null);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}

function runShortcut(payload) {
  const url = 'shortcuts://run-shortcut?name=' + encodeURIComponent(state.settings.shortcut) +
    '&input=text&text=' + encodeURIComponent(JSON.stringify(payload));
  window.location.href = url;
}

// ---------- Current parking ----------
function renderCurrent() {
  renderHero();
  const c = state.current;
  const info = $('mapInfo');
  const sec = $('statusSection');

  if (!c) {
    info.classList.add('hidden');
    $('mapCard').classList.remove('has-info');
    sec.innerHTML = `
      <h2>Status</h2>
      <div class="grid">
        <div class="tile wide glass">
          <span class="ibox">${icon('car')}</span>
          <div><div class="t1">Not parked</div></div>
        </div>
      </div>`;
    return;
  }

  const sweep = new Date(c.sweep), alertAt = new Date(c.alert), parked = new Date(c.parked);
  const cd = countdown(sweep - new Date());

  info.classList.remove('hidden');
  $('mapCard').classList.add('has-info');
  info.innerHTML = `
    <div class="row">
      <div style="min-width:0">
        <div class="name">${esc(c.name)}</div>
        <div class="meta">${c.lat != null ? 'Parking location saved' : 'No location saved'}</div>
      </div>
      <div class="count">${cd || 'Now'}<small>until sweeping</small></div>
    </div>`;

  const nav = c.lat != null
    ? `<a class="pill glass" href="https://maps.apple.com/?daddr=${c.lat},${c.lng}&dirflg=w">${icon('nav', 'sm')}Walk to Car</a>`
    : '';
  sec.innerHTML = `
    <h2>Status</h2>
    <div class="grid">
      <div class="tile on glass">
        <span class="ibox">${icon('calendar')}</span>
        <div><div class="t1">${fmtShort(sweep)}</div><div class="t2">Next sweeping</div></div>
      </div>
      <div class="tile glass">
        <span class="ibox">${icon('bell')}</span>
        <div><div class="t1">${fmtShort(alertAt)}</div><div class="t2">Reminder</div></div>
      </div>
      <div class="tile glass">
        <span class="ibox">${icon('clock')}</span>
        <div><div class="t1">${fmtShort(parked)}</div><div class="t2">Parked</div></div>
      </div>
      <button class="tile glass" id="resendBtn">
        <span class="ibox">${icon('refresh')}</span>
        <div><div class="t1">Resend</div><div class="t2">Create the reminder again</div></div>
      </button>
    </div>
    <div class="actions">
      ${nav}
      <button class="pill danger glass" id="clearBtn">${icon('check', 'sm')}I Moved My Car</button>
    </div>`;
  $('clearBtn').onclick = clearCurrent;
  $('resendBtn').onclick = () => sendSet(state.current);
}

// ---------- Pick a spot ----------
function renderPick() {
  const segs = state.segments.map(s => ({ ...s, d: here && s.lat != null ? dist(here, s) : null }));
  segs.sort((a, b) => (a.d ?? Infinity) - (b.d ?? Infinity));
  if (!selected) selected = segs.length ? segs[0].id : 'manual';

  let html = segs.map(s => `
    <button class="tile glass ${selected === s.id ? 'on' : ''}" data-pick="${s.id}">
      <span class="ibox">${icon('pin')}</span>
      <div>
        <div class="t1">${esc(s.name)}</div>
        <div class="t2">${DAYS[s.day]} ${hhmm(s.start)}–${hhmm(s.end)}${s.d != null ? '<br>' + fmtDist(s.d) : ''}</div>
      </div>
    </button>`).join('');
  html += `
    <button class="tile glass ${selected === 'manual' ? 'on' : ''}" data-pick="manual">
      <span class="ibox">${icon('edit')}</span>
      <div><div class="t1">Other spot</div><div class="t2">Enter the time manually</div></div>
    </button>`;
  $('pickList').innerHTML = html;
  $('pickList').querySelectorAll('[data-pick]').forEach(b => {
    b.onclick = () => { selected = b.dataset.pick; renderPick(); };
  });
  $('manualBox').classList.toggle('hidden', selected !== 'manual');
  renderPreview();
}

function getChoice() {
  if (selected === 'manual') {
    return { name: 'Other spot', day: Number($('manualDay').value), start: $('manualStart').value || '08:00' };
  }
  return state.segments.find(s => s.id === selected) || null;
}

function renderPreview() {
  const ch = getChoice();
  const box = $('previewBox');
  const sweep = ch ? nextSweep(ch.day, ch.start) : null;
  if (!sweep) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const alertAt = new Date(sweep - state.settings.lead * 60000);
  let html = `Next sweeping <b>${fmt(sweep)}</b><br>You'll be reminded <b>${fmt(alertAt)}</b>`;
  if (alertAt <= new Date()) html += `<div class="warn">Sweeping starts soon. The reminder will go off in 1 minute, so consider moving your car now.</div>`;
  box.innerHTML = html;
}

function sendSet(c) {
  const sweep = new Date(c.sweep);
  let minutes = Math.round((new Date(c.alert) - new Date()) / 60000);
  if (minutes < 1) minutes = 1;
  runShortcut({ action: 'set', minutes, title: `Move your car: ${c.name}, sweeping ${fmt(sweep)}` });
}

function park() {
  const ch = getChoice();
  if (!ch) { toast('Pick a spot first'); return; }
  const sweep = nextSweep(ch.day, ch.start);
  if (!sweep) { toast('Invalid time'); return; }
  const now = new Date();
  let alertAt = new Date(sweep - state.settings.lead * 60000);
  if (alertAt <= now) alertAt = new Date(now.getTime() + 60000);

  state.current = {
    name: ch.name,
    sweep: sweep.toISOString(),
    alert: alertAt.toISOString(),
    parked: now.toISOString(),
    lat: here ? here.lat : null,
    lng: here ? here.lng : null
  };
  save();
  renderAll(true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  sendSet(state.current);
}

function clearCurrent() {
  if (!confirm('Moved your car? This will also turn off the sweeping reminder.')) return;
  state.current = null;
  save();
  renderAll(true);
  runShortcut({ action: 'clear' });
}

// ---------- My spots ----------
function renderSegs() {
  const box = $('segList');
  if (!state.segments.length) {
    box.innerHTML = `<div class="empty">No spots yet. Add one while standing where you parked, and it will be suggested automatically next time.</div>`;
    return;
  }
  box.innerHTML = state.segments.map(s => `
    <div class="line">
      <span class="ibox-sq">${icon('pin', 'sm')}</span>
      <div class="grow">
        <div class="t1">${esc(s.name)}</div>
        <div class="t2">${DAYS_LONG[s.day]} ${hhmm(s.start)}–${hhmm(s.end)}${s.lat != null ? ', location saved' : ''}</div>
      </div>
      <button class="iconbtn del" data-del="${s.id}" aria-label="Delete">${icon('trash')}</button>
    </div>`).join('');
  box.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => {
      if (!confirm('Delete this spot?')) return;
      state.segments = state.segments.filter(s => s.id !== b.dataset.del);
      if (selected === b.dataset.del) selected = null;
      save();
      renderAll(false);
    };
  });
}

function addSeg() {
  const name = $('segName').value.trim();
  if (!name) { toast('Enter a name for this spot'); return; }
  const seg = {
    id: 's' + Date.now(),
    name,
    day: Number($('segDay').value),
    start: $('segStart').value || '08:00',
    end: $('segEnd').value || '10:00',
    lat: null, lng: null
  };
  const finish = () => {
    state.segments.push(seg);
    save();
    $('segName').value = '';
    $('addDetails').open = false;
    selected = seg.id;
    renderAll(false);
    toast('Spot saved');
  };
  if ($('segUseLoc').checked) {
    locate(pos => {
      if (pos) { seg.lat = pos.lat; seg.lng = pos.lng; }
      else toast('Location failed. Spot saved without a location.');
      finish();
    });
  } else finish();
}

function renderAll(recenter) {
  renderCurrent();
  renderPick();
  renderSegs();
  updateMap(recenter);
}

// ---------- Init ----------
function fillDays(sel, def) {
  sel.innerHTML = DAYS_LONG.map((d, i) => `<option value="${i}" ${i === def ? 'selected' : ''}>${d}</option>`).join('');
}
fillDays($('manualDay'), 2);
fillDays($('segDay'), 2);
$('manualDay').onchange = renderPreview;
$('manualStart').oninput = renderPreview;

$('leadInput').value = state.settings.lead;
$('shortcutInput').value = state.settings.shortcut;
$('leadInput').onchange = () => {
  const v = parseInt($('leadInput').value, 10);
  state.settings.lead = isNaN(v) ? 45 : Math.max(0, v);
  $('leadInput').value = state.settings.lead;
  save();
  renderPreview();
};
$('shortcutInput').onchange = () => {
  state.settings.shortcut = $('shortcutInput').value.trim() || SHORTCUT_NAME;
  $('shortcutInput').value = state.settings.shortcut;
  save();
};
$('testBtn').onclick = () => runShortcut({ action: 'set', minutes: 2, title: 'Street Sweeping Alert test' });
$('locateBtn').onclick = () => locate();
$('parkBtn').onclick = park;
$('addSegBtn').onclick = addSeg;
$('gotoSettings').onclick = () => $('settingsTitle').scrollIntoView({ behavior: 'smooth' });
$('centerCar').onclick = () => {
  if (map && carMarker) map.setView(carMarker.getLatLng(), 17);
  else toast('No parking location yet');
};
$('centerMe').onclick = () => {
  if (map && here) map.setView([here.lat, here.lng], 16);
  locate(pos => { if (pos && map) map.setView([pos.lat, pos.lng], 16); });
};

initMap();
renderAll(true);
locate();
setInterval(renderCurrent, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderCurrent(); });
</script>
</body>
</html>
