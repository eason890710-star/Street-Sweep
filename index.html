<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sweeping">
<meta name="theme-color" content="#2c3e5c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Street Sweeping</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    color-scheme: dark;
    --text: #ffffff;
    --muted: rgba(255, 255, 255, .68);
    --faint: rgba(255, 255, 255, .45);
    --glass: rgba(255, 255, 255, .14);
    --glass-on: rgba(255, 255, 255, .86);
    --stroke: rgba(255, 255, 255, .28);
    --on-text: #1c1c1e;
    --on-muted: rgba(28, 28, 30, .6);
    --accent: #ff9f0a;
    --danger: #ff6961;
    --blur: blur(28px) saturate(180%);
    --radius-l: 28px;
    --radius-m: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    font-size: 16px;
    line-height: 1.4;
    background: #2c3e5c;
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 40px);
  }

  /* Wallpaper */
  .wallpaper {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(60% 45% at 15% 10%, rgba(255, 183, 120, .55), transparent 70%),
      radial-gradient(55% 45% at 90% 30%, rgba(120, 170, 255, .55), transparent 70%),
      radial-gradient(70% 55% at 30% 95%, rgba(190, 120, 200, .45), transparent 70%),
      linear-gradient(165deg, #34507a 0%, #4a5f8a 40%, #6b5878 75%, #8a5f62 100%);
  }
  @media (prefers-color-scheme: dark) {
    .wallpaper {
      background:
        radial-gradient(60% 45% at 15% 10%, rgba(255, 150, 80, .28), transparent 70%),
        radial-gradient(55% 45% at 90% 30%, rgba(70, 120, 230, .35), transparent 70%),
        radial-gradient(70% 55% at 30% 95%, rgba(150, 80, 170, .3), transparent 70%),
        linear-gradient(165deg, #0d1626 0%, #18233c 45%, #261d33 80%, #2a1a22 100%);
    }
  }

  main { max-width: 560px; margin: 0 auto; }

  /* Glass material */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 1px solid var(--stroke);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .35),
      inset 0 -1px 0 rgba(255, 255, 255, .06),
      0 10px 30px rgba(0, 0, 0, .18);
  }

  /* Header */
  header { display: flex; align-items: flex-end; justify-content: space-between; margin: 6px 4px 14px; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; text-transform: uppercase; }
  h1 { font-size: 34px; font-weight: 700; margin: 2px 0 0; letter-spacing: -.01em; }
  .round {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    color: var(--text); cursor: pointer; padding: 0;
  }

  .ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .ic.sm { width: 16px; height: 16px; }
  .ic.lg { width: 22px; height: 22px; }

  h2 { font-size: 20px; font-weight: 700; margin: 26px 4px 10px; display: flex; align-items: center; justify-content: space-between; }
  h2 .sub { font-size: 14px; font-weight: 500; color: var(--muted); }

  /* Car hero (unframed, sits on wallpaper) */
  .hero { position: relative; margin: 0 0 18px; padding: 4px 0 0; }
  .hero .car { display: block; width: 92%; max-width: 360px; margin: 0 -8px 0 auto; position: relative; z-index: 1; }
  .hero .meta-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 6px 4px 0; }
  .hero .stat { font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
  .hero .stat small { font-size: 15px; font-weight: 600; margin-left: 3px; }
  .hero .label { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .hero .stat { display: flex; align-items: center; gap: 10px; }
  .light { width: 10px; height: 10px; border-radius: 50%; flex: none; background: #ff453a;
    box-shadow: 0 0 0 4px rgba(255, 69, 58, .22), 0 0 14px 2px rgba(255, 69, 58, .75); }
  .light.ok { background: #30d158; box-shadow: 0 0 0 4px rgba(48, 209, 88, .22), 0 0 14px 2px rgba(48, 209, 88, .75); }
  .addr { display: flex; align-items: center; gap: 6px; max-width: 100%; margin-top: 6px; padding: 0;
    background: none; border: none; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
  .addr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .addr .chev-r { opacity: .7; }
  .map-info { cursor: pointer; }

  /* Open-in-maps sheet */
  .sheet-bg { position: fixed; inset: 0; z-index: 3000; background: rgba(0, 0, 0, .4);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); }
  .sheet { width: 100%; max-width: 420px; border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    background: rgba(40, 44, 58, .7); }
  .sheet .title { font-size: 13px; color: var(--muted); text-align: center; margin: 2px 0 4px; }
  .sheet .pill { flex: none; }

  /* Map */
  .map-card { position: relative; border-radius: var(--radius-l); overflow: hidden; isolation: isolate; height: min(48vh, 400px); min-height: 280px; }
  #map { position: absolute; inset: 0; background: #39465c; }
  .map-ctrl { position: absolute; top: 12px; right: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
  .map-ctrl .round { width: 40px; height: 40px; background: rgba(40, 40, 50, .35); }
  .map-info {
    position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 1000;
    border-radius: var(--radius-m); padding: 14px 16px;
    background: rgba(30, 34, 46, .38);
  }
  .map-info .name { font-size: 17px; font-weight: 600; }
  .map-info .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .map-info .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .count { font-size: 26px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .count small { font-size: 13px; font-weight: 500; color: var(--muted); display: block; text-align: right; }

  .map-card.gray #map canvas { filter: grayscale(1) contrast(.9) brightness(1.05); }
  @media (prefers-color-scheme: dark) {
    .map-card.gray #map canvas, #map canvas { filter: invert(1) hue-rotate(180deg) brightness(.95) contrast(.88) saturate(.6); }
  }
  .maplibregl-ctrl-attrib { background: rgba(20, 20, 30, .35) !important; color: rgba(255, 255, 255, .75); font-size: 9px; }
  .maplibregl-ctrl-attrib a { color: rgba(255, 255, 255, .85) !important; }
  .maplibregl-ctrl-attrib-button { filter: invert(1); }
  .map-card.has-info .maplibregl-ctrl-bottom-right { bottom: 96px; }
  .seg-dot { cursor: default; }

  .car-pin {
    width: 44px; height: 44px; border-radius: 50%;
    background: #fff; color: var(--accent);
    display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35), 0 0 0 6px rgba(255, 159, 10, .28);
  }
  .car-pin .ic { width: 24px; height: 24px; stroke-width: 2; }
  .me-dot {
    width: 16px; height: 16px; border-radius: 50%;
    background: #0a84ff; border: 3px solid #fff;
    box-shadow: 0 0 0 8px rgba(10, 132, 255, .22), 0 2px 6px rgba(0, 0, 0, .3);
  }
  .seg-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(255, 255, 255, .9); border: 2px solid rgba(60, 60, 80, .55);
  }

  /* Tiles */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile {
    border-radius: var(--radius-m); padding: 14px;
    min-height: 104px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    text-align: left; color: var(--text); font: inherit; cursor: default;
    transition: background .2s, transform .15s;
  }
  button.tile, a.tile { cursor: pointer; }
  a.tile { text-decoration: none; }
  a.tile:active { transform: scale(.97); }
  button.tile:active { transform: scale(.97); }
  .tile .ibox {
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, .18);
  }
  .tile .t1 { font-size: 15px; font-weight: 600; line-height: 1.25; }
  .tile .t2 { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .tile.on { background: var(--glass-on); color: var(--on-text); border-color: rgba(255, 255, 255, .9); }
  .tile.on .t2 { color: var(--on-muted); }
  .tile.on .ibox { background: var(--accent); color: #fff; }
  .tile.warn-tile { background: rgba(255, 69, 58, .32); border-color: rgba(255, 140, 130, .55); }
  .tile.warn-tile .ibox { background: rgba(255, 69, 58, .85); color: #fff; }
  .tile.wide { grid-column: span 2; min-height: 0; flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px; }

  /* Buttons */
  .actions { display: flex; gap: 10px; margin-top: 10px; }
  .pill {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: inherit; font-size: 15px; font-weight: 600; color: var(--text);
    padding: 13px 14px; border-radius: 999px; cursor: pointer; text-decoration: none;
  }
  .pill:active { transform: scale(.97); }
  .pill.primary { background: var(--glass-on); color: var(--on-text); border-color: rgba(255, 255, 255, .9); }
  .pill.danger { color: var(--danger); }
  .pill.go { background: rgba(48, 209, 88, .92); color: #fff; border-color: rgba(255, 255, 255, .5); }
  .park-actions { margin-top: 12px; }
  .park-actions .pill { padding: 15px 14px; font-size: 16px; }
  .park-actions .pill { flex: 1 1 0; min-width: 0; }
  .pill.full { width: 100%; margin-top: 12px; padding: 15px; font-size: 16px; }

  /* Panels & forms */
  .panel { border-radius: var(--radius-m); padding: 6px 16px; }
  .panel.pad { padding: 16px; }
  .line { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid rgba(255, 255, 255, .12); }
  .line:first-child { border-top: none; }
  .line .grow { flex: 1; min-width: 0; }
  .line .t1 { font-size: 15px; font-weight: 500; }
  .line .t2 { font-size: 13px; color: var(--muted); }
  .ibox-sq { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, .16); flex: none; }
  .iconbtn { background: none; border: none; color: var(--muted); padding: 6px; cursor: pointer; display: grid; place-items: center; }
  .iconbtn.del { color: var(--danger); }
  .empty { color: var(--muted); font-size: 14px; padding: 14px 0; }

  label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 2px 6px; }
  input[type=text], input[type=number], input[type=time], select {
    width: 100%; font: inherit; font-size: 16px; color: var(--text);
    padding: 11px 13px; border-radius: 14px;
    border: 1px solid var(--stroke); background: rgba(255, 255, 255, .1);
    -webkit-appearance: none; appearance: none;
  }
  input::placeholder { color: var(--faint); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .three { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
  .check { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 14px; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }

  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin: 0 4px 10px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .status .dot.ok { background: #30d158; }
  .status .dot.bad { background: var(--danger); }
  .status button { margin-left: auto; }

  .preview { border-radius: var(--radius-m); padding: 14px 16px; margin-top: 10px; font-size: 14px; color: var(--muted); }
  .preview b { color: var(--text); font-weight: 600; }
  .warn { margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255, 159, 10, .2); border: 1px solid rgba(255, 159, 10, .45); color: #ffd28a; font-size: 13px; }

  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .summary { display: flex; align-items: center; gap: 12px; padding: 14px 0; font-size: 15px; font-weight: 600; }
  .summary .chev { margin-left: auto; transition: transform .2s; color: var(--muted); }
  details[open] .summary .chev { transform: rotate(90deg); }
  details .body { padding-bottom: 16px; }

  .hidden { display: none !important; }

  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 18px); z-index: 2000;
    max-width: 420px; margin: 0 auto; text-align: center;
    padding: 13px 18px; border-radius: 999px; font-size: 15px; font-weight: 500;
    background: rgba(30, 34, 46, .5);
    opacity: 0; transform: translateY(12px); transition: all .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }

  @media (max-width: 360px) {
    .three { grid-template-columns: 1fr 1fr; }
    .three > :first-child { grid-column: span 2; }
  }
</style>
</head>

const KEY = 'sweep-app-v1';
const SHORTCUT_NAME = 'Street Sweeping Alert';
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYS_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DEFAULT_CENTER = [34.0224, -118.2851];

function defaults() {
  return { segments: [], current: null, history: [], settings: { lead: 45, shortcut: SHORTCUT_NAME } };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s) {
      const d = defaults();
      const st = { ...d, ...s, settings: { ...d.settings, ...(s.settings || {}) } };
      if (st.settings.shortcut === '掃街提醒') st.settings.shortcut = SHORTCUT_NAME; // migrate old default
      return st;
    }
  } catch (e) {}
  return defaults();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

let state = load();
save();
let here = null;
let selected = null; // spot id or 'manual'

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (name, cls = '') => `<svg class="ic ${cls}"><use href="#i-${name}"/></svg>`;

function time12(h, m) {
  const ap = h >= 12 ? 'PM' : 'AM';
  const hh = h % 12 || 12;
  return `${hh}:${pad(m)} ${ap}`;
}
function hhmm(str) {
  const [h, m] = str.split(':').map(Number);
  return time12(h, m);
}
function fmt(d) {
  return `${DAYS[d.getDay()]}, ${d.getMonth() + 1}/${d.getDate()} ${time12(d.getHours(), d.getMinutes())}`;
}
function fmtShort(d) {
  return `${DAYS[d.getDay()]} ${time12(d.getHours(), d.getMinutes())}`;
}
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

function dist(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtDist(m) {
  const ft = m * 3.28084;
  return ft < 1000 ? Math.round(ft) + ' ft away' : (m / 1609.34).toFixed(1) + ' mi away';
}

// Next sweeping time (today included, if it hasn't started yet)
function nextSweep(weekday, start) {
  const now = new Date();
  const [h, m] = start.split(':').map(Number);
  for (let i = 0; i < 8; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, h, m, 0);
    if (d.getDay() === Number(weekday) && d > now) return d;
  }
  return null;
}

function countdown(ms) {
  if (ms <= 0) return null;
  const mins = Math.floor(ms / 60000);
  const d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${m} min`;
}

// ---------- Car hero ----------
function isSet() {
  const c = state.current;
  return !!(c && new Date(c.sweep) > new Date());
}
function renderHero() {
  const c = state.current, on = isSet();
  $('heroLight').classList.toggle('ok', on);
  $('heroStat').textContent = on ? 'Reminder Set' : 'No Reminder';
  const addr = $('heroAddr');
  if (on && c.lat != null) {
    $('heroAddrText').textContent = c.address || 'Looking up address…';
    addr.classList.remove('hidden');
  } else {
    addr.classList.add('hidden');
  }
}

// Reverse geocoding with OpenStreetMap (no API key needed)
async function lookupAddress(lat, lng) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat=${lat}&lon=${lng}`,
      { headers: { 'Accept-Language': 'en' } });
    const j = await res.json();
    const ad = j.address || {};
    const street = [ad.house_number, ad.road].filter(Boolean).join(' ');
    const city = ad.city || ad.town || ad.village || ad.suburb || '';
    return [street, city].filter(Boolean).join(', ') || j.display_name || null;
  } catch (e) {
    return null;
  }
}
async function fillAddress() {
  const c = state.current;
  if (!c || c.lat == null || c.address) return;
  const addr = await lookupAddress(c.lat, c.lng);
  if (state.current !== c) return;
  c.address = addr || `${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}`;
  save();
  renderHero();
}

// Open-in-maps sheet
function openMapSheet() {
  const c = state.current;
  if (!c || c.lat == null) { toast('No parking location yet'); return; }
  const label = encodeURIComponent('My Car');
  $('openApple').href = `https://maps.apple.com/?ll=${c.lat},${c.lng}&q=${label}`;
  $('openGoogle').href = `https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`;
  $('sheetTitle').textContent = c.address ? `Open ${c.address} in` : "Open your car's location in";
  $('sheet').classList.remove('hidden');
}
function closeMapSheet() { $('sheet').classList.add('hidden'); }

// ---------- Map ----------
let map = null, carMarker = null, meMarker = null;
const MAP_STYLE = 'https://tiles.openfreemap.org/styles/positron';

function el(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.firstElementChild;
}
function centerOn(lat, lng, zoom) {
  if (!map) return;
  const bottom = $('mapCard').classList.contains('has-info') ? 110 : 0;
  map.jumpTo({ center: [lng, lat], zoom, padding: { top: 0, left: 0, right: 0, bottom } });
}

function initMap() {
  if (!window.maplibregl) {
    $('map').innerHTML = '<div style="display:grid;place-items:center;height:100%;color:rgba(255,255,255,.7);font-size:14px">Map unavailable. Check your connection.</div>';
    return;
  }
  map = new maplibregl.Map({
    container: 'map',
    style: MAP_STYLE,
    center: [DEFAULT_CENTER[1], DEFAULT_CENTER[0]],
    zoom: 14,
    attributionControl: { compact: true },
    pitchWithRotate: false,
    dragRotate: false
  });
  map.touchZoomRotate.disableRotation();
  map.on('click', openMapSheet);
  map.on('load', () => { map.resize(); updateMap(true); });

  // Fallback: if the minimal style can't load, use plain OpenStreetMap in grayscale
  let styleOk = false, fellBack = false;
  map.on('style.load', () => { styleOk = true; });
  map.on('error', () => {
    if (styleOk || fellBack) return;
    fellBack = true;
    $('mapCard').classList.add('gray');
    map.setStyle({
      version: 8,
      sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256,
        attribution: '&copy; OpenStreetMap contributors' } },
      layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
    });
  });
}

function updateMap(recenter) {
  if (!map) return;
  const c = state.current;

  if (c && c.lat != null) {
    if (!carMarker) {
      const node = el(`<div class="car-pin">${icon('car')}</div>`);
      node.addEventListener('click', e => { e.stopPropagation(); openMapSheet(); });
      carMarker = new maplibregl.Marker({ element: node }).setLngLat([c.lng, c.lat]).addTo(map);
    } else carMarker.setLngLat([c.lng, c.lat]);
  } else if (carMarker) {
    carMarker.remove();
    carMarker = null;
  }

  if (here) {
    if (!meMarker) meMarker = new maplibregl.Marker({ element: el('<div class="me-dot"></div>') }).setLngLat([here.lng, here.lat]).addTo(map);
    else meMarker.setLngLat([here.lng, here.lat]);
  }

  if (recenter) {
    if (c && c.lat != null) centerOn(c.lat, c.lng, 16.5);
    else if (here) centerOn(here.lat, here.lng, 15.5);
  }
}

// ---------- Location ----------
function setLoc(text, ok) {
  $('locStatus').textContent = text;
  $('locDot').className = 'dot' + (ok === true ? ' ok' : ok === false ? ' bad' : '');
}

function locate(cb) {
  if (!navigator.geolocation) {
    setLoc('Location is not supported in this browser', false);
    cb && cb(null);
    return;
  }
  setLoc('Finding your location…');
  navigator.geolocation.getCurrentPosition(p => {
    const first = !here;
    here = { lat: p.coords.latitude, lng: p.coords.longitude };
    setLoc(`Located, accurate to about ${Math.round(p.coords.accuracy * 3.28084)} ft`, true);
    updateMap(first && !state.current);
    cb && cb(here);
  }, err => {
    setLoc('Could not get location: ' + err.message, false);
    cb && cb(null);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}

function runShortcut(payload) {
  const url = 'shortcuts://run-shortcut?name=' + encodeURIComponent(state.settings.shortcut) +
    '&input=text&text=' + encodeURIComponent(JSON.stringify(payload));
  window.location.href = url;
}

// ---------- Current parking ----------
function renderCurrent() {
  renderHero();
  const c = state.current;
  const info = $('mapInfo');
  const sec = $('statusSection');

  if (!c) {
    info.classList.add('hidden');
    $('mapCard').classList.remove('has-info');
    sec.innerHTML = `
      <h2>Status</h2>
      <div class="grid">
        <div class="tile wide glass warn-tile">
          <span class="ibox">${icon('car')}</span>
          <div><div class="t1">Not parked</div></div>
        </div>
      </div>`;
    return;
  }

  const sweep = new Date(c.sweep), alertAt = new Date(c.alert), parked = new Date(c.parked);
  const cd = countdown(sweep - new Date());

  info.classList.remove('hidden');
  $('mapCard').classList.add('has-info');
  info.innerHTML = `
    <div class="row">
      <div style="min-width:0">
        <div class="name">${esc(c.name)}</div>
        <div class="meta">${c.lat != null ? 'Parking location saved' : 'No location saved'}</div>
      </div>
      <div class="count">${cd || 'Now'}<small>until sweeping</small></div>
    </div>`;

  const nav = c.lat != null
    ? `<a class="pill glass" href="https://maps.apple.com/?daddr=${c.lat},${c.lng}&dirflg=w">${icon('nav', 'sm')}Walk to Car</a>`
    : '';
  sec.innerHTML = `
    <h2>Status</h2>
    <div class="grid">
      <div class="tile on glass">
        <span class="ibox">${icon('calendar')}</span>
        <div><div class="t1">${fmtShort(sweep)}</div><div class="t2">Next sweeping</div></div>
      </div>
      <a class="tile glass" href="x-apple-reminderkit://">
        <span class="ibox">${icon('bell')}</span>
        <div><div class="t1">${fmtShort(alertAt)}</div><div class="t2">Reminder</div></div>
      </a>
      <div class="tile glass">
        <span class="ibox">${icon('clock')}</span>
        <div><div class="t1">${fmtShort(parked)}</div><div class="t2">Parked</div></div>
      </div>
      <button class="tile glass" id="resendBtn">
        <span class="ibox">${icon('refresh')}</span>
        <div><div class="t1">Resend</div><div class="t2">Create again</div></div>
      </button>
    </div>
    <div class="actions">
      ${nav}
      <button class="pill danger glass" id="clearBtn">${icon('check', 'sm')}I Moved My Car</button>
    </div>`;
  $('clearBtn').onclick = clearCurrent;
  $('resendBtn').onclick = () => sendSet(state.current);
}

// ---------- Pick a sweeping time ----------
function renderPick() {
  const segs = state.segments;
  if (!selected || (selected !== 'manual' && !segs.some(t => t.id === selected))) {
    selected = segs.some(t => t.id === state.lastUsed) ? state.lastUsed : (segs.length ? segs[0].id : 'manual');
  }
  let html = segs.map(t => `
    <button class="tile glass ${selected === t.id ? 'on' : ''}" data-pick="${t.id}">
      <span class="ibox">${icon('calendar')}</span>
      <div>
        <div class="t1">${DAYS[t.day]} ${hhmm(t.start)}</div>
        <div class="t2">${t.name ? esc(t.name) : 'until ' + hhmm(t.end)}</div>
      </div>
    </button>`).join('');
  html += `
    <button class="tile glass ${selected === 'manual' ? 'on' : ''}" data-pick="manual">
      <span class="ibox">${icon('edit')}</span>
      <div><div class="t1">Other time</div><div class="t2">Enter it manually</div></div>
    </button>`;
  $('pickList').innerHTML = html;
  $('pickList').querySelectorAll('[data-pick]').forEach(b => {
    b.onclick = () => { selected = b.dataset.pick; renderPick(); };
  });
  $('manualBox').classList.toggle('hidden', selected !== 'manual');
  renderPreview();
}

function schedLabel(t) {
  return `${DAYS[t.day]} ${hhmm(t.start)}${t.end ? '–' + hhmm(t.end) : ''}`;
}
function getChoice() {
  if (selected === 'manual') {
    return { day: Number($('manualDay').value), start: $('manualStart').value || '08:00', end: null };
  }
  return state.segments.find(s => s.id === selected) || null;
}

function renderPreview() {
  const ch = getChoice();
  const box = $('previewBox');
  const sweep = ch ? nextSweep(ch.day, ch.start) : null;
  if (!sweep) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const alertAt = new Date(sweep - state.settings.lead * 60000);
  let html = `Next sweeping <b>${fmt(sweep)}</b><br>You'll be reminded <b>${fmt(alertAt)}</b>`;
  if (alertAt <= new Date()) html += `<div class="warn">Sweeping starts soon. The reminder will go off in 1 minute, so consider moving your car now.</div>`;
  box.innerHTML = html;
}

function sendSet(c) {
  const sweep = new Date(c.sweep);
  let minutes = Math.round((new Date(c.alert) - new Date()) / 60000);
  if (minutes < 1) minutes = 1;
  runShortcut({ action: 'set', minutes, title: `Street Sweeping at ${fmt(sweep)}` });
}

function addHours(hm, n) {
  const [h, m] = hm.split(':').map(Number);
  return `${pad((h + n) % 24)}:${pad(m)}`;
}

function park() {
  const ch = getChoice();
  if (!ch) { toast('Pick a sweeping time first'); return; }
  const sweep = nextSweep(ch.day, ch.start);
  if (!sweep) { toast('Invalid time'); return; }
  const now = new Date();
  let alertAt = new Date(sweep - state.settings.lead * 60000);
  if (alertAt <= now) alertAt = new Date(now.getTime() + 60000);

  if (selected === 'manual' && $('manualSave').checked) {
    const t = { id: 's' + Date.now(), name: '', day: ch.day, start: ch.start, end: addHours(ch.start, 2) };
    state.segments.push(t);
    selected = t.id;
    $('manualSave').checked = false;
  }
  if (selected !== 'manual') state.lastUsed = selected;
  if (!here) toast('Location not found yet. Reminder set without a location.');

  state.current = {
    name: schedLabel(ch),
    sweep: sweep.toISOString(),
    alert: alertAt.toISOString(),
    parked: now.toISOString(),
    lat: here ? here.lat : null,
    lng: here ? here.lng : null
  };
  save();
  renderAll(true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  sendSet(state.current);
  fillAddress();
}

function clearCurrent() {
  if (!confirm('Moved your car? This will also turn off the sweeping reminder.')) return;
  state.current = null;
  save();
  renderAll(true);
  runShortcut({ action: 'clear' });
}

// ---------- My sweeping times ----------
function renderSegs() {
  const box = $('segList');
  if (!state.segments.length) {
    box.innerHTML = `<div class="empty">No sweeping times yet. Add the times from the signs near where you usually park.</div>`;
    return;
  }
  const list = [...state.segments].sort((a, b) => a.day - b.day || a.start.localeCompare(b.start));
  box.innerHTML = list.map(t => `
    <div class="line">
      <span class="ibox-sq">${icon('calendar', 'sm')}</span>
      <div class="grow">
        <div class="t1">${DAYS_LONG[t.day]} ${hhmm(t.start)}–${hhmm(t.end)}</div>
        ${t.name ? `<div class="t2">${esc(t.name)}</div>` : ''}
      </div>
      <button class="iconbtn del" data-del="${t.id}" aria-label="Delete">${icon('trash')}</button>
    </div>`).join('');
  box.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => {
      if (!confirm('Delete this sweeping time?')) return;
      state.segments = state.segments.filter(t => t.id !== b.dataset.del);
      if (selected === b.dataset.del) selected = null;
      save();
      renderAll(false);
    };
  });
}

function addSeg() {
  const t = {
    id: 's' + Date.now(),
    name: $('segName').value.trim(),
    day: Number($('segDay').value),
    start: $('segStart').value || '08:00',
    end: $('segEnd').value || '10:00'
  };
  if (state.segments.some(x => x.day === t.day && x.start === t.start)) { toast('This time is already saved'); return; }
  state.segments.push(t);
  save();
  $('segName').value = '';
  $('addDetails').open = false;
  selected = t.id;
  renderAll(false);
  toast('Sweeping time saved');
}

function renderAll(recenter) {
  renderCurrent();
  renderPick();
  renderSegs();
  updateMap(recenter);
}

// ---------- Init ----------
function fillDays(sel, def) {
  sel.innerHTML = DAYS_LONG.map((d, i) => `<option value="${i}" ${i === def ? 'selected' : ''}>${d}</option>`).join('');
}
fillDays($('manualDay'), 2);
fillDays($('segDay'), 2);
$('manualDay').onchange = renderPreview;
$('manualStart').oninput = renderPreview;

$('leadInput').value = state.settings.lead;
$('shortcutInput').value = state.settings.shortcut;
$('leadInput').onchange = () => {
  const v = parseInt($('leadInput').value, 10);
  state.settings.lead = isNaN(v) ? 45 : Math.max(0, v);
  $('leadInput').value = state.settings.lead;
  save();
  renderPreview();
};
$('shortcutInput').onchange = () => {
  state.settings.shortcut = $('shortcutInput').value.trim() || SHORTCUT_NAME;
  $('shortcutInput').value = state.settings.shortcut;
  save();
};
$('testBtn').onclick = () => runShortcut({ action: 'set', minutes: 2, title: 'Street Sweeping Alert test' });
$('locateBtn').onclick = () => locate();
$('parkBtn').onclick = park;
$('addSegBtn').onclick = addSeg;
$('heroAddr').onclick = openMapSheet;
$('mapInfo').onclick = openMapSheet;
$('openApple').onclick = closeMapSheet;
$('openGoogle').onclick = closeMapSheet;
$('sheetCancel').onclick = closeMapSheet;
$('sheet').onclick = e => { if (e.target === $('sheet')) closeMapSheet(); };
$('centerCar').onclick = () => {
  const c = state.current;
  if (map && c && c.lat != null) centerOn(c.lat, c.lng, 16.5);
  else toast('No parking location yet');
};
$('centerMe').onclick = () => {
  if (here) centerOn(here.lat, here.lng, 15.5);
  locate(pos => { if (pos) centerOn(pos.lat, pos.lng, 15.5); });
};

initMap();
renderAll(true);
fillAddress();
// Block page zoom (pinch and double-tap); the map keeps its own pinch-to-zoom
['gesturestart', 'gesturechange', 'gestureend'].forEach(t =>
  document.addEventListener(t, e => { if (!e.target.closest('#map')) e.preventDefault(); }, { passive: false }));
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 300 && !e.target.closest('#map')) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

locate();
// Keep the location fresh while the page is open, so "Set Reminder" always uses where you are now
if (navigator.geolocation) {
  navigator.geolocation.watchPosition(p => {
    here = { lat: p.coords.latitude, lng: p.coords.longitude };
    setLoc(`Located, accurate to about ${Math.round(p.coords.accuracy * 3.28084)} ft`, true);
    updateMap(false);
  }, () => {}, { enableHighAccuracy: true, maximumAge: 10000 });
}
setInterval(renderCurrent, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderCurrent(); });
</script>
</body>
</html>
